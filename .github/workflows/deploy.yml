name: Auto Deploy to SBC Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy package
        run: |
          rm -rf deploy-package
          mkdir -p deploy-package
          cp index.html deploy-package/
          cp -R assets deploy-package/
          cp -R api deploy-package/
          cp version.json deploy-package/
          cp .htaccess deploy-package/ 2>/dev/null || true
          cp maintenance.html deploy-package/ 2>/dev/null || true
          cp sbc-mobile.apk deploy-package/ 2>/dev/null || true
          cp data/.htaccess deploy-package/data/.htaccess 2>/dev/null || true
          test -f deploy-package/index.html && echo "package ok" || exit 1

      - name: Upload to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          protocol: ftp
          timeout: 120000
          server-dir: /
          local-dir: deploy-package/
          exclude: |
            **/.maintenance

      - name: Remove stale api/partner.php from server
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USERNAME }}
          PASS: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import ftplib, os
          host = os.environ["HOST"]
          port = int(os.environ["PORT"])
          user = os.environ["USER"]
          pwd = os.environ["PASS"]
          ftp = ftplib.FTP_TLS()
          ftp.connect(host, port, timeout=60)
          ftp.login(user, pwd)
          try:
              print("initial pwd:", ftp.pwd())
              for d in ["", "/", "public_html", "/public_html", "/api", "api", "/public_html/api", "public_html/api"]:
                  try:
                      ftp.cwd(d)
                      items = ftp.nlst()
                      print("CWD:", ftp.pwd(), "count:", len(items), "local:", [x for x in items if "local" in x], "partner:", [x for x in items if "partner" in x])
                  except Exception as e:
                      print("CWD", d, "ERROR", e)
          finally:
              try:
                  ftp.quit()
              except Exception:
                  pass
          EOF