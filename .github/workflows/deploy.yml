name: Auto Deploy to SBC Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy package
        run: |
          rm -rf deploy-package
          mkdir -p deploy-package
          cp index.html deploy-package/
          cp -R assets deploy-package/
          cp -R api deploy-package/
          cp version.json deploy-package/
          cp .htaccess deploy-package/ 2>/dev/null || true
          cp maintenance.html deploy-package/ 2>/dev/null || true
          cp sbc-mobile.apk deploy-package/ 2>/dev/null || true
          cp data/.htaccess deploy-package/data/.htaccess 2>/dev/null || true
          test -f deploy-package/index.html && echo "package ok" || exit 1

      - name: Upload to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          protocol: ftp
          timeout: 120000
          server-dir: /
          local-dir: deploy-package/
          exclude: |
            **/.maintenance

      - name: Remove stale api/partner.php from server
        run: |
          curl -sS --max-time 60 --connect-timeout 20 --ftp-pasv --ssl-reqd -k \
            --user "${{ secrets.HOSTINGER_USERNAME }}:${{ secrets.HOSTINGER_PASSWORD }}" \
            -Q "DELE /api/partner.php" \
            "ftp://${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_PORT }}/" \
            && echo "stale partner.php deleted" || echo "delete skipped (already gone or no permission)"