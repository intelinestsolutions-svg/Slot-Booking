name: Auto Deploy to SBC Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write api/config.local.php from secrets
        env:
          TP_MODE: ${{ secrets.TOYYIBPAY_MODE }}
          TP_KEY: ${{ secrets.TOYYIBPAY_USER_SECRET_KEY }}
          TP_CAT: ${{ secrets.TOYYIBPAY_CATEGORY_CODE }}
          VTOKEN: ${{ secrets.VERIFY_TOKEN }}
          MVKEY: ${{ secrets.MPK_VERIFY_KEY }}
          ADMIN_EMAIL: ${{ secrets.DEFAULT_ADMIN_EMAIL }}
          ADMIN_PASS: ${{ secrets.DEFAULT_ADMIN_PASSWORD }}
          SMS_GATEWAY: ${{ secrets.SMS_GATEWAY }}
          SMS_INSTANCE: ${{ secrets.SMS_INSTANCE_ID }}
          SMS_TOKEN: ${{ secrets.SMS_TOKEN }}
          SMS_URL: ${{ secrets.SMS_URL }}
          SMS_USER: ${{ secrets.SMS_USER }}
          SMS_PASS: ${{ secrets.SMS_PASS }}
          SMS_TO: ${{ secrets.SMS_TO }}
          OTP_CHANNEL: ${{ secrets.OTP_CHANNEL }}
        run: |
          cat > api/config.local.php <<EOF
          <?php
          /* Generated by GitHub Actions deploy - keys do NOT live in git. */
          define('SITE_URL', 'https://apps.sabahbuskers.my');
          define('TOYYIBPAY_MODE', '${TP_MODE}');
          define('TOYYIBPAY_USER_SECRET_KEY', '${TP_KEY}');
          define('TOYYIBPAY_CATEGORY_CODE', '${TP_CAT}');
          define('VERIFY_TOKEN', '${VTOKEN}');
          define('MPK_VERIFY_KEY', '${MVKEY}');
          define('DEFAULT_ADMIN_EMAIL', '${ADMIN_EMAIL}');
          define('DEFAULT_ADMIN_PASSWORD', '${ADMIN_PASS}');
          define('SMS_GATEWAY', '${SMS_GATEWAY}');
          define('SMS_INSTANCE_ID', '${SMS_INSTANCE}');
          define('SMS_TOKEN', '${SMS_TOKEN}');
          define('SMS_URL', '${SMS_URL}');
          define('SMS_USER', '${SMS_USER}');
          define('SMS_PASS', '${SMS_PASS}');
          define('SMS_TO', '${SMS_TO}');
          define('OTP_CHANNEL', '${OTP_CHANNEL}');
          EOF
          test -s api/config.local.php || { echo "config.local.php not written"; exit 1; }

      - name: Prepare deploy package
        run: |
          rm -rf deploy-package
          mkdir -p deploy-package
          cp index.html deploy-package/
          cp -R assets deploy-package/
          cp -R api deploy-package/
          cp version.json deploy-package/
          cp .htaccess deploy-package/ 2>/dev/null || true
          cp maintenance.html deploy-package/ 2>/dev/null || true
          cp sbc-mobile.apk deploy-package/ 2>/dev/null || true
          cp data/.htaccess deploy-package/data/.htaccess 2>/dev/null || true
          test -f deploy-package/index.html && echo "package ok" || exit 1

      - name: Upload to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          # ftps = explicit TLS (AUTH TLS). Plain "ftp" sent HOSTINGER_PASSWORD
          # in cleartext on every push. Hostinger does not offer implicit TLS
          # on port 21, so "ftps-legacy" would fail here.
          protocol: ftps
          # loose = do not require the cert hostname to match; we connect by IP
          # address, which strict verification would reject.
          security: loose
          timeout: 120000
          server-dir: /public_html/
          local-dir: deploy-package/
          exclude: |
            **/.maintenance

      - name: Purge stale files from server (partner.php, premium removals)
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USERNAME }}
          PASS: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import ftplib, os
          host = os.environ["HOST"]
          port = int(os.environ["PORT"])
          user = os.environ["USER"]
          pwd = os.environ["PASS"]
          ftp = ftplib.FTP_TLS()
          ftp.connect(host, port, timeout=60)
          ftp.login(user, pwd)
          # (directories, files) — premium feature removed; partner.php legacy.
          targets = [
              (["/api", "/public_html/api"], ["partner.php", "premium.php"]),
              (["/assets/js/views", "/public_html/assets/js/views"], ["premium.js"]),
          ]
          for roots, files in targets:
              for root in roots:
                  try:
                      ftp.cwd(root)
                      names = ftp.nlst()
                      for f in files:
                          if f in names:
                              ftp.delete(f)
                              print("deleted", f, "at", root)
                          else:
                              print("no", f, "at", root)
                  except Exception as e:
                      print("skipped", root, "->", e)
          try:
              ftp.quit()
          except Exception:
              pass
          EOF